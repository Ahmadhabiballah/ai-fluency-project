# CI: GitHub runs these checks on a clean machine every time something lands on main.
#
# Two checks:
#   Proposal structure  - always: the proposal exists and keeps its four headings,
#                         and neither it nor about-me.md has merge-conflict markers.
#   Proposal complete   - on your fork only: no "<!-- ... -->" placeholder is left
#                         in any section. It is skipped in the course's own copy,
#                         whose proposal is the blank Week 1 template on purpose.
#
# GitHub switches workflows off on a new fork: enable them once in the Actions tab.
# On your laptop, `uv run pytest` runs both.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structure:
    name: Proposal structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install the project
        run: uv sync --locked

      - name: Check the proposal's structure
        run: uv run pytest -m "not proposal_complete" -rfs

  complete:
    name: Proposal complete
    # On a fork only: the course's own copy keeps the blank Week 1 template on purpose.
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install the project
        run: uv sync --locked

      - name: Check that every section is written
        run: uv run pytest -m proposal_complete -rfs
